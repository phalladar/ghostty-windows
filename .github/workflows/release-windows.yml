name: Release Windows

on:
  push:
    tags:
      - "windows-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.3.2-windows.1 (tag windows-v<version> is created)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository != 'ghostty-org/ghostty'
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          cache-key: release-windows-${{ hashFiles('build.zig.zon') }}

      - name: Resolve version
        shell: pwsh
        run: |
          $v = $env:VERSION -replace '^windows-v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+([-+][0-9A-Za-z.-]+)?$') { throw "invalid version '$v'" }
          "VERSION=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "TAG=windows-v$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build
        run: zig build -Dapp-runtime=win32 -Doptimize=ReleaseFast -Dcpu=baseline -Dversion-string=${{ env.VERSION }} -p build/release

      - name: Test
        run: zig build test -Dapp-runtime=win32

      - name: Package zip
        shell: pwsh
        run: ./dist/windows/make-zip.ps1 -Prefix build/release -Version $env:VERSION

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\dist\windows\out\staging\ghostty" "/DOutputDir=$PWD\dist\windows\out" dist\windows\installer\ghostty.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      - name: Collect assets
        shell: pwsh
        run: |
          $out = 'dist/windows/out'
          $assets = New-Item -ItemType Directory -Force 'release-assets'
          Copy-Item "$out/ghostty-$env:VERSION-windows-x86_64.zip" "$assets/Ghostty-Windows-x64.zip"
          Copy-Item "$out/ghostty-$env:VERSION-windows-x86_64-setup.exe" "$assets/Ghostty-Windows-Setup-x64.exe"
          Get-ChildItem $assets -File | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content -Encoding ascii "$assets/SHA256SUMS.txt"
          Get-Content "$assets/SHA256SUMS.txt"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem release-assets -File | ForEach-Object { $_.FullName }
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @files --clobber
          } else {
            $notes = "Ghostty for Windows $env:VERSION, an unofficial community port of [Ghostty](https://github.com/ghostty-org/ghostty).`n`n**Install:** download ``Ghostty-Windows-Setup-x64.exe`` and run it (per-user, no admin needed).`n**Portable:** unzip ``Ghostty-Windows-x64.zip`` and run ``ghostty\bin\ghostty.exe``.`n`nThe binaries are not code-signed yet, so Windows SmartScreen may ask you to confirm (More info, then Run anyway). Verify downloads against ``SHA256SUMS.txt``."
            gh release create $env:TAG @files --target $env:GITHUB_SHA --title "Ghostty for Windows $env:VERSION" --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed with $LASTEXITCODE" }
